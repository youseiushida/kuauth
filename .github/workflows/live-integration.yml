name: Live integration

# Runs the real IdP/SP tests once a day. Must NOT be wired to
# ``pull_request`` — that would hand forks access to the secrets.
on:
  schedule:
    - cron: '0 17 * * *'    # 17:00 UTC = 02:00 JST, off-peak
  workflow_dispatch:         # manual trigger for debugging

permissions:
  contents: read

# One live run at a time. ``cancel-in-progress: false`` lets the current
# run finish (killing it mid-SAML could leave junk sessions).
concurrency:
  group: live-integration
  cancel-in-progress: false

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      KUAUTH_LIVE: '1'
      KUAUTH_USERNAME: ${{ secrets.KUAUTH_USERNAME }}
      KUAUTH_PASSWORD: ${{ secrets.KUAUTH_PASSWORD }}
      KUAUTH_TOTP_SECRET: ${{ secrets.KUAUTH_TOTP_SECRET }}

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv python install 3.12
      - run: uv sync

      # Fail fast if USERNAME/PASSWORD are missing — without those,
      # every test would hit the IdP with empty credentials and risk
      # account lockout. TOTP_SECRET is intentionally optional: when
      # absent, the OTP-gated KULASIS/KULMS tests skip themselves but
      # MyKULINE/PandA still run. Hard-failing here would lose all
      # non-OTP coverage during a TOTP rotation.
      - name: Verify required secrets are present
        run: |
          for v in KUAUTH_USERNAME KUAUTH_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is empty; configure it in repo secrets"
              exit 1
            fi
          done
          if [ -z "$KUAUTH_TOTP_SECRET" ]; then
            echo "::warning::KUAUTH_TOTP_SECRET is empty; KULASIS/KULMS tests will skip"
          fi

      # --maxfail=1: stop at the first failure so a broken fixture can't
      #   trigger a second login attempt against the IdP.
      # --tb=short: suppresses ``locals`` in tracebacks so the password
      #   can't leak into logs via frame-level repr.
      - name: Run integration tests
        run: uv run pytest tests/integration --tb=short --maxfail=1 -q
