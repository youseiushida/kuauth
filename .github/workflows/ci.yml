name: CI

# General-purpose CI on every push/PR. The other workflows have narrower
# remits:
#   - codeql.yml runs the CodeQL analysis + bespoke QL tests.
#   - live-integration.yml hits real Kyoto-U IdPs on a daily cron.
# This workflow handles the lint / type / unit+replay / audit gates that
# every PR must pass before merge.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests

  typecheck:
    name: Type check (pyright)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync
      # The pyright PyPI wrapper downloads node lazily on first run, which
      # is flaky on Windows and slow even on Linux. The official action
      # invokes the npm package directly with a pre-installed node, so it
      # finishes in ~10s and is the one we run in CI. Local devs still get
      # ``uv run pyright`` (config below in pyproject.toml [tool.pyright])
      # but with the caveat that the first run is slow.
      - uses: jakebailey/pyright-action@v2
        with:
          version: '1.1.409'
          python-version: '3.12'

  test:
    name: Unit + replay tests (coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # codecov-action's tokenless (OIDC) upload mints a short-lived ID
    # token via GitHub's OIDC provider; that requires id-token: write at
    # the job level. ``contents: read`` is the workflow default but we
    # restate it here because once you set any permission on a job, the
    # rest fall back to none.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync
      # --cov-fail-under floors coverage at 80%. Current baseline is ~86%,
      # so the 6-point buffer absorbs small refactors without false failures
      # while still gating against significant regressions.
      - name: Run pytest with coverage
        run: |
          uv run pytest tests/unit tests/replay \
            --cov --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=80
      # Upload to Codecov for the badge + per-PR coverage diff comments.
      # ``fail_ci_if_error: false`` so a Codecov outage doesn't break the
      # gate — the coverage floor enforced above is the real check.
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          # OIDC-based upload; no CODECOV_TOKEN secret required for public
          # repos. The Codecov account just needs to have the repo linked.
          use_oidc: true

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync
      # Audit only runtime deps — dev tools (ruff, pyright, pytest, etc.)
      # ship to no one, so a CVE there is not a kuauth user-facing problem
      # and the noise would dominate alerts. ``uv export --no-dev`` writes
      # the runtime-only resolution from uv.lock to a requirements file
      # that pip-audit can consume.
      # ``--no-emit-project`` excludes kuauth itself from the export.
      # Without it, uv export writes an editable line for the project root
      # (``-e file://${{ github.workspace }}``), which pip-audit's hashed
      # install path can't materialize ("cannot be installed when requiring
      # hashes, because there is no single file to hash"). We're auditing
      # third-party deps for CVEs, not the local source tree.
      - name: Export runtime dependencies
        run: uv export --no-dev --no-emit-project --frozen --format requirements-txt -o requirements.txt
      - name: Run pip-audit
        run: uv run pip-audit -r requirements.txt --strict
