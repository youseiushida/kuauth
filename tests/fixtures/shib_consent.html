<!DOCTYPE html>
<html lang="ja">
<head><title>Information Release</title></head>
<body>
<h2>Information Release</h2>
<form action="/idp/profile/SAML2/Redirect/SSO?execution=e1s1" method="post">

  <fieldset>
    <legend>Information that will be sent</legend>
    <input type="checkbox" name="_shib_idp_consentIds" value="uid" checked>uid<br>

</form>
</body>
</html>
