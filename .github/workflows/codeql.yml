name: CodeQL

# Static analysis for credential-handling code paths. Two layers:
#  1. ``security-extended`` — GitHub's curated Python security suite.
#  2. The local pack at ``.github/codeql/queries`` — bespoke taint queries
#     pinned to ``KyotoUAuth.password`` / ``_totp_secret`` / ``_resolve_otp``
#     and the four legitimate IdP/CAS form-submit sinks.
#
# We do NOT trigger on every fork PR write because CodeQL alerts surface
# in the Security tab; a pull_request from a fork only gets a check run,
# the alert itself only lands on push to main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly re-scan picks up new rules in security-extended even when the
    # codebase hasn't changed. Mondays 03:00 UTC = 12:00 JST, off-peak.
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        language: [python]

    steps:
      - uses: actions/checkout@v7

      # uv installs the project so CodeQL's Python extractor can resolve
      # imports of ``httpx`` / ``bs4`` / ``pyotp`` and follow taint into
      # third-party signatures (improves precision on httpx sinks).
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync

      # Put the uv venv on PATH and PYTHONPATH BEFORE init so the
      # extractor picks up the right interpreter and resolves
      # ``import kuauth`` against the source tree. With
      # ``setup-python-dependencies: false`` below, init does NOT try to
      # auto-install — it uses whatever interpreter PATH points at.
      - name: Expose uv venv to CodeQL
        run: |
          echo "$(pwd)/.venv/bin" >> "$GITHUB_PATH"
          echo "PYTHONPATH=$(pwd)/src" >> "$GITHUB_ENV"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'

  query-tests:
    # Two layers of protection for the bespoke pack:
    #
    # 1. ``pytest tests/unit/test_codeql_query_surface.py`` pins the
    #    ``KyotoUAuth`` attribute / method / submitter names that the
    #    QL queries match against. The QL fixtures use synthetic
    #    stand-ins that mirror those names, so without this Python
    #    invariant test a rename in ``src/kuauth/auth.py`` would
    #    silently un-bind the queries while ``codeql test run`` stayed
    #    green.
    # 2. ``codeql test run`` against the committed ``.expected``
    #    baselines catches the case where the QL logic itself changes
    #    output without a corresponding baseline update.
    #
    # Pytest runs first because it's <1s and a failure there means the
    # QL fixtures are testing the wrong surface — running the slower
    # QL tests in that state would just hide the real diagnostic.
    name: QL test run
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync

      - name: Pin kuauth surface invariants (pytest)
        run: uv run pytest tests/unit/test_codeql_query_surface.py -v

      # init@v3 installs the CodeQL CLI into the runner tool cache. In
      # principle it also adds the binary to PATH for subsequent steps,
      # but we hit ``codeql: command not found`` in practice on
      # ubuntu-latest with v3.35.x. Locating it ourselves and exporting
      # via GITHUB_PATH is more robust against that PATH-export drift.
      - name: Initialize CodeQL (for CLI only)
        uses: github/codeql-action/init@v4
        with:
          languages: python

      - name: Expose CodeQL CLI on PATH
        run: |
          CODEQL_BIN="$(find /opt/hostedtoolcache/CodeQL -name codeql -type f -executable 2>/dev/null | head -1)"
          if [ -z "$CODEQL_BIN" ]; then
            echo "::error::CodeQL CLI not found in tool cache after init"
            exit 1
          fi
          echo "Located CodeQL at $CODEQL_BIN"
          dirname "$CODEQL_BIN" >> "$GITHUB_PATH"

      - name: Resolve pack dependencies
        run: |
          codeql pack install .github/codeql/lib
          codeql pack install .github/codeql/queries
          codeql pack install .github/codeql/queries/tests

      - name: Run QL tests against committed baselines
        run: codeql test run .github/codeql/queries/tests/
